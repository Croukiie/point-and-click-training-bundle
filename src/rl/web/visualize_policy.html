<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PnC policy visualizer</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #6b7280;
      --line: #d8dee8;
      --panel: #ffffff;
      --page: #f4f6f9;
      --blue: #1f77b4;
      --red: #d94c4c;
      --green: #17845b;
      --shadow: 0 8px 24px rgba(22, 32, 51, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 980px;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px 14px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
    #profileBadge {
      padding: 7px 11px;
      border-radius: 999px;
      background: #eef4ff;
      color: #285a9b;
      font-size: 12px;
      font-weight: 700;
    }
    main { padding: 18px 24px 26px; }
    .visual-grid {
      display: grid;
      grid-template-columns: minmax(390px, 1.45fr) minmax(250px, 0.8fr) minmax(350px, 1.15fr);
      gap: 14px;
      align-items: stretch;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 11px 14px 9px;
      border-bottom: 1px solid #edf0f4;
      font-size: 15px;
      text-align: center;
      font-weight: 650;
    }
    canvas { display: block; width: 100%; height: 410px; }
    .charts { display: grid; grid-template-rows: 1fr 1fr; gap: 14px; }
    .charts canvas { height: 174px; }
    .lower-grid {
      display: grid;
      grid-template-columns: minmax(670px, 2fr) minmax(350px, 1fr);
      gap: 14px;
      margin-top: 14px;
    }
    .controls { padding: 14px 16px 16px; }
    .slider-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(300px, 1fr));
      column-gap: 32px;
      row-gap: 8px;
    }
    .slider-row {
      display: grid;
      grid-template-columns: 132px 1fr 68px;
      gap: 9px;
      align-items: center;
      min-height: 26px;
      font-size: 12px;
    }
    .slider-row label { color: #303849; }
    .slider-row output {
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: #111827;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
      cursor: pointer;
    }
    .button-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid #edf0f4;
    }
    button {
      min-width: 92px;
      border: 1px solid #c8d0dc;
      border-radius: 8px;
      padding: 9px 15px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { background: #f7f9fc; }
    button.primary { background: #225f9f; border-color: #225f9f; color: white; }
    button:disabled { opacity: 0.55; cursor: wait; }
    #status { margin-right: auto; color: var(--muted); font-size: 12px; }
    .metrics { padding: 13px 17px 16px; }
    .metrics dl {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px 18px;
      margin: 0;
      font-size: 13px;
    }
    .metrics dt { color: var(--muted); }
    .metrics dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 650; }
    .metrics .success { color: var(--green); }
    .metrics .failure { color: var(--red); }
    .legend {
      display: flex;
      gap: 14px;
      justify-content: center;
      padding: 7px 10px 10px;
      color: var(--muted);
      font-size: 11px;
    }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 16px;
      margin-right: 5px;
      vertical-align: 3px;
      border-top: 2px solid var(--legend);
    }
    @media (max-width: 1180px) {
      .visual-grid { grid-template-columns: 1fr 0.72fr; }
      .charts { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; grid-template-rows: none; }
      .lower-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1 id="title">SAC policy</h1>
    <div id="profileBadge">Loading profile…</div>
  </header>

  <main>
    <section class="visual-grid">
      <article class="panel">
        <h2>Monitor — target and cursor</h2>
        <canvas id="monitorCanvas"></canvas>
        <div class="legend">
          <span style="--legend:#d94c4c">target</span>
          <span style="--legend:#171717">screen cursor</span>
          <span style="--legend:#9aa2ad">cursor without rotation</span>
        </div>
      </article>
      <article class="panel">
        <h2>Table / physical mouse</h2>
        <canvas id="deskCanvas"></canvas>
      </article>
      <section class="charts">
        <article class="panel">
          <h2>Distance to target</h2>
          <canvas id="distanceCanvas"></canvas>
        </article>
        <article class="panel">
          <h2>Mouse rotation</h2>
          <canvas id="rotationCanvas"></canvas>
        </article>
      </section>
    </section>

    <section class="lower-grid">
      <article class="panel controls">
        <div id="sliderGrid" class="slider-grid"></div>
        <div class="button-row">
          <span id="status">Starting…</span>
          <button id="runButton" class="primary">Run</button>
          <button id="playButton">Pause</button>
          <button id="resetButton">Reset</button>
        </div>
      </article>
      <article class="panel metrics">
        <h2 style="margin:-13px -17px 13px">Episode metrics</h2>
        <dl id="metrics"></dl>
      </article>
    </section>
  </main>

  <script>
    const state = {
      config: null,
      data: null,
      frame: 0,
      playing: false,
      startedAt: 0,
      startFrameTime: 0,
      animationId: null,
      autoRunTimer: null,
      running: false,
      needsRun: false,
      suppressSliderEvents: false,
    };

    const sprite = new Image();
    sprite.src = "/sprite.png";
    sprite.onload = () => drawAll();

    const $ = (id) => document.getElementById(id);
    const canvases = ["monitorCanvas", "deskCanvas", "distanceCanvas", "rotationCanvas"];

    function setupCanvas(canvas) {
      const ratio = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const width = Math.max(1, Math.round(rect.width * ratio));
      const height = Math.max(1, Math.round(rect.height * ratio));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return {ctx, width: rect.width, height: rect.height};
    }

    function formatValue(name, value) {
      if (name === "seed" || name === "target_direction") return Number(value).toFixed(0);
      if (name === "target_radius") return Number(value).toFixed(5);
      const magnitude = Math.abs(Number(value));
      if (magnitude >= 10) return Number(value).toFixed(2);
      return Number(value).toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
    }

    function buildSliders() {
      const grid = $("sliderGrid");
      grid.replaceChildren();
      for (const spec of state.config.sliders) {
        const row = document.createElement("div");
        row.className = "slider-row";
        const label = document.createElement("label");
        label.htmlFor = `slider-${spec.name}`;
        label.textContent = spec.label;
        const input = document.createElement("input");
        input.type = "range";
        input.id = `slider-${spec.name}`;
        input.dataset.name = spec.name;
        input.min = spec.min;
        input.max = spec.max;
        input.step = spec.step;
        input.value = spec.value;
        const output = document.createElement("output");
        output.htmlFor = input.id;
        output.textContent = formatValue(spec.name, spec.value);
        input.addEventListener("input", () => {
          output.textContent = formatValue(spec.name, input.value);
          scheduleAutoRun();
        });
        row.append(label, input, output);
        grid.append(row);
      }
    }

    function parameterValues() {
      return Object.fromEntries(
        [...document.querySelectorAll("input[type=range][data-name]")]
          .map(input => [input.dataset.name, Number(input.value)])
      );
    }

    function setDefaults() {
      state.suppressSliderEvents = true;
      try {
        for (const spec of state.config.sliders) {
          const input = $(`slider-${spec.name}`);
          input.value = spec.value;
          const output = input.parentElement.querySelector("output");
          if (output) output.textContent = formatValue(spec.name, spec.value);
        }
      } finally {
        state.suppressSliderEvents = false;
      }
    }

    function scheduleAutoRun() {
      if (state.suppressSliderEvents || !state.config) return;
      clearTimeout(state.autoRunTimer);
      $("status").textContent = "Slider changed — recomputing rollout…";
      state.autoRunTimer = setTimeout(() => runPolicy(), 180);
    }

    async function runPolicy() {
      if (state.running) {
        state.needsRun = true;
        return;
      }
      state.running = true;
      state.needsRun = false;
      clearTimeout(state.autoRunTimer);
      const runButton = $("runButton");
      runButton.disabled = true;
      $("status").textContent = "Computing policy rollout…";
      stopAnimation();
      try {
        const response = await fetch("/api/rollout", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({parameters: parameterValues()}),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "Rollout failed");
        state.data = payload;
        state.frame = 0;
        renderMetrics(payload.metrics);
        drawAll();
        $("status").textContent = `${payload.frames.length - 1} steps · reward ${payload.metrics.totalReward.toFixed(3)}`;
        startAnimation();
      } catch (error) {
        $("status").textContent = `Error: ${error.message}`;
      } finally {
        runButton.disabled = false;
        state.running = false;
        if (state.needsRun) {
          state.needsRun = false;
          runPolicy();
        }
      }
    }

    function startAnimation() {
      if (!state.data?.frames?.length) return;
      if (state.frame >= state.data.frames.length - 1) state.frame = 0;
      state.playing = true;
      state.startedAt = performance.now();
      state.startFrameTime = state.data.frames[state.frame].time;
      $("playButton").textContent = "Pause";
      cancelAnimationFrame(state.animationId);
      state.animationId = requestAnimationFrame(animationStep);
    }

    function stopAnimation() {
      state.playing = false;
      cancelAnimationFrame(state.animationId);
      $("playButton").textContent = "Play";
    }

    function animationStep(now) {
      if (!state.playing || !state.data) return;
      const frames = state.data.frames;
      const episodeTime = state.startFrameTime + (now - state.startedAt) / 1000;
      while (state.frame < frames.length - 1 && frames[state.frame + 1].time <= episodeTime) {
        state.frame += 1;
      }
      drawAll();
      if (state.frame >= frames.length - 1) {
        stopAnimation();
      } else {
        state.animationId = requestAnimationFrame(animationStep);
      }
    }

    function worldBounds(points, padding, square = true) {
      const xs = points.map(p => p[0]);
      const ys = points.map(p => p[1]);
      let minX = Math.min(...xs) - padding, maxX = Math.max(...xs) + padding;
      let minY = Math.min(...ys) - padding, maxY = Math.max(...ys) + padding;
      if (square) {
        const span = Math.max(maxX - minX, maxY - minY, 0.08);
        const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
        minX = cx - span / 2; maxX = cx + span / 2;
        minY = cy - span / 2; maxY = cy + span / 2;
      }
      return {minX, maxX, minY, maxY};
    }

    function mapper(bounds, width, height, margin = 35) {
      const plotW = width - 2 * margin, plotH = height - 2 * margin;
      return {
        x: value => margin + (value - bounds.minX) / (bounds.maxX - bounds.minX) * plotW,
        y: value => height - margin - (value - bounds.minY) / (bounds.maxY - bounds.minY) * plotH,
        sx: value => value / (bounds.maxX - bounds.minX) * plotW,
        sy: value => value / (bounds.maxY - bounds.minY) * plotH,
        margin,
      };
    }

    function drawGrid(ctx, width, height, map, bounds) {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#e7eaf0";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const x = map.margin + i * (width - 2 * map.margin) / 5;
        const y = map.margin + i * (height - 2 * map.margin) / 5;
        ctx.beginPath(); ctx.moveTo(x, map.margin); ctx.lineTo(x, height - map.margin); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(map.margin, y); ctx.lineTo(width - map.margin, y); ctx.stroke();
      }
      ctx.strokeStyle = "#7f8793";
      ctx.strokeRect(map.margin, map.margin, width - 2 * map.margin, height - 2 * map.margin);
      ctx.fillStyle = "#626b78";
      ctx.font = "10px system-ui";
      ctx.fillText(`${bounds.minX.toFixed(2)} m`, map.margin, height - 11);
      ctx.textAlign = "right";
      ctx.fillText(`${bounds.maxX.toFixed(2)} m`, width - map.margin, height - 11);
      ctx.textAlign = "left";
    }

    function drawPath(ctx, frames, key, map, color, dash = []) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.setLineDash(dash);
      ctx.beginPath();
      frames.slice(0, state.frame + 1).forEach((frame, i) => {
        const point = frame[key];
        if (i === 0) ctx.moveTo(map.x(point[0]), map.y(point[1]));
        else ctx.lineTo(map.x(point[0]), map.y(point[1]));
      });
      ctx.stroke();
      ctx.restore();
    }

    function drawMonitor() {
      if (!state.data) return;
      const canvas = $("monitorCanvas");
      const {ctx, width, height} = setupCanvas(canvas);
      const frames = state.data.frames;
      const points = frames.flatMap(f => [f.cursor, f.cursorReference, f.target]);
      const bounds = worldBounds(points, frames[0].targetRadius + 0.025);
      const map = mapper(bounds, width, height);
      drawGrid(ctx, width, height, map, bounds);
      drawPath(ctx, frames, "cursorReference", map, "#9aa2ad", [5, 4]);
      drawPath(ctx, frames, "cursor", map, "#171717");
      drawPath(ctx, frames, "target", map, "#d94c4c");
      const frame = frames[state.frame];
      const radius = Math.abs(map.sx(frame.targetRadius));
      ctx.fillStyle = "rgba(217,76,76,.18)";
      ctx.strokeStyle = "rgba(217,76,76,.55)";
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(map.x(frame.target[0]), map.y(frame.target[1]), radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#d23838";
      ctx.beginPath(); ctx.arc(map.x(frame.target[0]), map.y(frame.target[1]), 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#161616";
      ctx.beginPath(); ctx.arc(map.x(frame.cursor[0]), map.y(frame.cursor[1]), 4.5, 0, Math.PI * 2); ctx.fill();
      if (state.frame === frames.length - 1 && frame.click) {
        const x = map.x(frame.click[0]), y = map.y(frame.click[1]);
        ctx.strokeStyle = "#7a2fa3"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y + 6); ctx.moveTo(x + 6, y - 6); ctx.lineTo(x - 6, y + 6); ctx.stroke();
      }
    }

    function drawDesk() {
      if (!state.data) return;
      const canvas = $("deskCanvas");
      const {ctx, width, height} = setupCanvas(canvas);
      const frames = state.data.frames;
      const bounds = {minX: -0.30, maxX: 0.30, minY: -0.20, maxY: 0.20};
      const map = mapper(bounds, width, height, 24);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#c79b70"; ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#303744";
      ctx.fillRect(map.x(-0.225), map.y(0.15), map.sx(0.45), map.sy(0.30));
      ctx.strokeStyle = "#121722"; ctx.lineWidth = 2; ctx.strokeRect(map.x(-0.225), map.y(0.15), map.sx(0.45), map.sy(0.30));
      drawPath(ctx, frames, "hand", map, "rgba(254,173,50,.9)");
      const frame = frames[state.frame];
      const x = map.x(frame.hand[0]), y = map.y(frame.hand[1]);
      const spriteHeight = map.sy(0.24);
      const spriteWidth = spriteHeight * (sprite.naturalWidth || 820) / (sprite.naturalHeight || 840);
      if (sprite.complete) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-frame.rotation);
        ctx.drawImage(sprite, -spriteWidth / 2, -spriteHeight * 0.30, spriteWidth, spriteHeight);
        ctx.restore();
      }
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.fillRect(8, 8, 150, 23);
      ctx.fillStyle = "#273142"; ctx.font = "12px ui-monospace, monospace";
      ctx.fillText(`rotation: ${(frame.rotation * 180 / Math.PI).toFixed(1)}°`, 14, 24);
    }

    function drawChart(canvasId, values, color, options = {}) {
      const canvas = $(canvasId);
      const {ctx, width, height} = setupCanvas(canvas);
      const margin = 33;
      ctx.clearRect(0, 0, width, height); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, width, height);
      const maxTime = Math.max(state.data.frames.at(-1).time, 0.01);
      let minY = options.minY ?? Math.min(...values);
      let maxY = options.maxY ?? Math.max(...values);
      if (maxY - minY < 1e-9) { minY -= 1; maxY += 1; }
      const pad = (maxY - minY) * 0.12;
      minY -= pad; maxY += pad;
      const x = t => margin + t / maxTime * (width - 2 * margin);
      const y = v => height - margin - (v - minY) / (maxY - minY) * (height - 2 * margin);
      ctx.strokeStyle = "#e7eaf0";
      for (let i = 0; i <= 4; i++) {
        const yy = margin + i * (height - 2 * margin) / 4;
        ctx.beginPath(); ctx.moveTo(margin, yy); ctx.lineTo(width - margin, yy); ctx.stroke();
      }
      if (options.reference != null) {
        ctx.strokeStyle = "#d94c4c"; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(margin, y(options.reference)); ctx.lineTo(width - margin, y(options.reference)); ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
      state.data.frames.forEach((frame, i) => {
        if (i === 0) ctx.moveTo(x(frame.time), y(values[i])); else ctx.lineTo(x(frame.time), y(values[i]));
      });
      ctx.stroke();
      const currentX = x(state.data.frames[state.frame].time);
      ctx.strokeStyle = "rgba(50,85,130,.65)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(currentX, margin); ctx.lineTo(currentX, height - margin); ctx.stroke();
      ctx.fillStyle = "#626b78"; ctx.font = "10px system-ui";
      ctx.fillText(maxY.toFixed(options.decimals ?? 2), 3, margin + 3);
      ctx.fillText(minY.toFixed(options.decimals ?? 2), 3, height - margin + 3);
      ctx.textAlign = "right"; ctx.fillText(`${maxTime.toFixed(2)} s`, width - margin, height - 10); ctx.textAlign = "left";
    }

    function drawAll() {
      if (!state.data) return;
      drawMonitor();
      drawDesk();
      drawChart("distanceCanvas", state.data.frames.map(f => f.distance), "#222", {
        minY: 0,
        reference: state.data.frames[0].targetRadius,
        decimals: 3,
      });
      drawChart("rotationCanvas", state.data.frames.map(f => f.rotation * 180 / Math.PI), "#16759f", {decimals: 1});
    }

    function renderMetrics(metrics) {
      const rows = [
        ["Outcome", metrics.hit ? "Hit" : "Miss", metrics.hit ? "success" : "failure"],
        ["Best policy accuracy", `${(state.config.bestPolicyAccuracy * 100).toFixed(1)}%`],
        ["Episode time", `${metrics.episodeTime.toFixed(3)} s`],
        ["Total reward", metrics.totalReward.toFixed(3)],
        ["Click distance", `${metrics.clickDistance.toFixed(4)} m`],
        ["Click / radius", metrics.clickRadiusRatio.toFixed(2)],
        ["Target radius", `${metrics.targetRadius.toFixed(4)} m`],
        ["Target speed", `${metrics.targetSpeed.toFixed(3)} m/s`],
        ["Target direction", `${metrics.targetDirection.toFixed(1)}°`],
        ["Physical mouse path", `${metrics.mousePath.toFixed(4)} m`],
        ["Final rotation", `${metrics.finalRotationDegrees.toFixed(1)}°`],
      ];
      const dl = $("metrics"); dl.replaceChildren();
      for (const [label, value, className] of rows) {
        const dt = document.createElement("dt"); dt.textContent = label;
        const dd = document.createElement("dd"); dd.textContent = value; if (className) dd.className = className;
        dl.append(dt, dd);
      }
    }

    async function initialize() {
      try {
        const response = await fetch("/api/config");
        state.config = await response.json();
        $("title").textContent = `SAC policy — ${state.config.modelName}`;
        const profile = state.config.profile || {};
        if (profile.profile === "neutral") {
          $("profileBadge").textContent = "Neutral parameters";
        } else {
          const rate = profile.measured_success_rate;
          $("profileBadge").textContent = rate == null
            ? (profile.profile || "Saved profile")
            : `Best profile · ${(rate * 100).toFixed(1)}% eval success`;
        }
        buildSliders();
        await runPolicy();
      } catch (error) {
        $("status").textContent = `Initialization error: ${error.message}`;
      }
    }

    $("runButton").addEventListener("click", runPolicy);
    $("playButton").addEventListener("click", () => state.playing ? stopAnimation() : startAnimation());
    $("resetButton").addEventListener("click", async () => { setDefaults(); await runPolicy(); });
    window.addEventListener("resize", drawAll);
    initialize();
  </script>
</body>
</html>
