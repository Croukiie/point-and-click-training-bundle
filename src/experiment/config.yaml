experiment:
  name: pnc_cpi_study
  protocol_version: target_radius_matched_v2
  refresh_hz: 240
  timeout_s: 3.0
  inter_trial_s: 0.30
  feedback_s: 0.0
  # V2 keeps the cursor continuous across trials and therefore has no separate
  # red positioning target before the white task target.
  start_target_enabled: false
  start_target_radius_m: 0.006
  practice_trials_per_cpi: 15
  measured_trials_per_cpi: 128
  cpi_values: [400, 800, 1600]
  mousepad_conditions: [firm, soft, glass]
  # width_m * reference_cpi / (0.0254 * width_px)
  mouse_gain: 4.357877685367455
  mouse_reference_cpi: 400
  target_id_range: [2.5, 7.2]
  target_radius_range_m: [0.00125, 0.007]
  seed: 20260708

display:
  profile_name: 24_inch_full_hd
  enforce_fixed_profile: false
  warn_if_not_fixed_profile: true
  physical_tolerance_cm: 1.5
  resolution_px: [1920, 1080]
  physical_size_m: [0.5313124474, 0.2988632517]
  virtual_size_m: [0.5313124474, 0.2988632517]

logging:
  # Effective Windows Raw Input rate measured independently on the lab mouse.
  # Raw-count summaries use the same 125 Hz binning contract before the
  # amortizer's separate 20 Hz trajectory preprocessing.
  expected_mouse_polling_hz: 125
  writer_queue_size: 12

appearance:
  background_rgb: [24, 27, 33]
  target_rgb: [244, 162, 97]
  start_target_rgb: [235, 64, 52]
  cursor_style: aero_arrow
  cursor_bitmap_size_px: [32, 32]
  cursor_rgb: [255, 255, 255]
  cursor_outline_rgb: [32, 32, 32]
  cursor_shadow_rgb: [0, 0, 0]
  cursor_shadow_alpha: 0
  cursor_shadow_offset_px: 0
  cursor_arrow_width_px: 12
  cursor_arrow_height_px: 18
  cursor_arrow_outline_px: 1
  phase_counter_rgb: [230, 232, 236]
  phase_counter_alpha: 0.48
  phase_counter_font_px: 14
  phase_counter_margin_px: 18
  success_rgb: [24, 27, 33]
  failure_rgb: [24, 27, 33]
  text_rgb: [230, 232, 236]
