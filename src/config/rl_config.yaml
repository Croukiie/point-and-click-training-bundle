default:
  callback:
    save_freq: 500000
    eval_freq: 100000
    eval_ep: 2048
  
  model:
    device: auto
    mlp:
      arch: [512, 512, 512]
      concat: [0, 1, 2, 3]
      embed:
    batch: 2048
    lr: 0.00005
    gamma: 0.99
    entropy: auto
    target_entropy: auto
  
  train:
    step: 30000000
    log_freq: 100

simple:
  callback:
    save_freq: 5000000
    eval_freq: 10000
    eval_ep: 2048
  
  model:
    device: auto
    mlp:
      arch: [512, 512]
      concat: [0, 1, 2]
      embed:
    batch: 2048
    lr: 0.0001
    gamma: 0.99
    entropy: auto
    target_entropy: auto
  
  train:
    step: 30000000
    log_freq: 100

cpi_study:
  callback:
    save_freq: 5000000
    eval_freq: 100000
    eval_ep: 512

  model:
    device: auto
    mlp:
      arch: [512, 512]
      concat: [0, 1, 2]
      embed:
    batch: 2048
    lr: 0.00005
    gamma: 0.99
    entropy: auto
    target_entropy: auto
    # Compromise between the previous fast setting (1) and one update per
    # transition with eight vectorized environments (8).
    gradient_steps: 2

  train:
    step: 30000000
    log_freq: 100
