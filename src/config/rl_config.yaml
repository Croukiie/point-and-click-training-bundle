default:
  callback:
    save_freq: 500000
    eval_freq: 100000
    eval_ep: 2048
  
  model:
    device: auto
    mlp:
      arch: [512, 512, 512]
      concat: [0, 1, 2, 3]
      embed:
    batch: 2048
    lr: 0.00005
    gamma: 0.99
    entropy: auto
    target_entropy: auto
  
  train:
    step: 30000000
    log_freq: 100

simple:
  callback:
    save_freq: 5000000
    eval_freq: 10000
    eval_ep: 2048
  
  model:
    device: auto
    mlp:
      arch: [512, 512]
      concat: [0, 1, 2]
      embed:
    batch: 2048
    lr: 0.0001
    gamma: 0.99
    entropy: auto
    target_entropy: auto
  
  train:
    step: 30000000
    log_freq: 100
