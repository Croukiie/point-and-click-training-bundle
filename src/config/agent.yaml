reactions:  # Millisec
  default:  
    hand:
      type: uniform   # uniform, log-uniform, normal, skew-normal, ...
      max: 400
      min: 100

observations:
  default:
    list: [cursor_pos, cursor_vel, target_pos, target_rad, elapsed_time, hand_pos, hand_vel, mouse_ori]
    cursor_pos:
      max: [0.3, 0.3]
      min: [-0.3, -0.3]
    target_pos:
      max: [0.3, 0.3]
      min: [-0.3, -0.3]
    target_rad:
      max: [0.1]
      min: [-0.1]
    cursor_vel:
      max: [5.0, 5.0]
      min: [-5.0, -5.0]
    target_rew:
      max: [10.0]
      min: [-10.0]
    elapsed_time:
      max: [3.0]
      min: [-3.0]
    hand_pos:
      max: [0.3, 0.3]
      min: [-0.3, -0.3]
    hand_vel:
      max: [1.5, 1.5]
      min: [-1.5, -1.5]
    mouse_ori:
      max: [1.0, 1.0]
      min: [-1.0, -1.0]
  
actions:
  default:
    list: [th, kc, tc]
    th:   # Millisec
      max: 2000
      min: 100
    kc:
      threshold: 0.8
      max: 1.0
      min: 0.0
    tc:
      max: 1.0
      min: 0.0
  
  icp:
    list: [th, kc]
    th:   # Millisec
      max: 2000
      min: 100
    kc:
      threshold: 0.8
      max: 1.0
      min: 0.0

  extended_icp:
    list: [th, kc]
    th:   # Millisec
      max: 2000
      min: 100
    kc:
      threshold: [0.8, 0.9]
      max: 1.0
      min: 0.0

param_moduls:
  cpi_24inch:
    # Approximately 400--1600 CPI with one raw count mapped to one pixel
    # on the measured 530 mm / 1920 px display.
    list: [theta_m, theta_c, rew_succ, rew_fail, time_penalty, effort_cost, mouse_rotation_gain_x, mouse_rotation_gain_y, mouse_plan_correction, mouse_gain]
    theta_m:
      type: uniform
      max: 0.40
      min: 0.05
    theta_c:
      type: uniform
      max: 0.40
      min: 0.05
    rew_succ:
      type: uniform
      max: 16.0
      min: 0.0
      sample_min_prob: 0.01
    rew_fail:
      type: uniform
      max: 16.0
      min: 0.0
      sample_min_prob: 0.01
    time_penalty:
      type: uniform
      max: 32.0
      min: 0.0
      sample_min_prob: 0.01
    effort_cost:
      type: uniform
      max: 32.0
      min: 0.0
      sample_min_prob: 0.01
    mouse_rotation_gain_x:
      type: uniform
      max: 10.0
      min: -10.0
    mouse_rotation_gain_y:
      type: uniform
      max: 10.0
      min: -10.0
    mouse_plan_correction:
      type: uniform
      max: 1.0
      min: 0.0
    mouse_gain:
      type: uniform
      max: 17.40
      min: 4.35

  cpi_variable:
    # CPI is observed directly by the policy and controls sensor-count
    # quantization independently from the control-display mouse gain.
    list: [theta_m, theta_c, rew_succ, rew_fail, time_penalty, effort_cost, mouse_rotation_gain_x, mouse_rotation_gain_y, mouse_plan_correction, mouse_cpi]
    theta_m:
      type: uniform
      max: 0.40
      min: 0.05
    theta_c:
      type: uniform
      max: 0.40
      min: 0.05
    rew_succ:
      type: uniform
      max: 16.0
      min: 0.0
      sample_min_prob: 0.01
    rew_fail:
      type: uniform
      max: 16.0
      min: 0.0
      sample_min_prob: 0.01
    time_penalty:
      type: uniform
      max: 32.0
      min: 0.0
      sample_min_prob: 0.01
    effort_cost:
      type: uniform
      max: 32.0
      min: 0.0
      sample_min_prob: 0.01
    mouse_rotation_gain_x:
      type: uniform
      max: 10.0
      min: -10.0
    mouse_rotation_gain_y:
      type: uniform
      max: 10.0
      min: -10.0
    mouse_plan_correction:
      type: uniform
      max: 1.0
      min: 0.0
    mouse_cpi:
      type: uniform
      max: 1600.0
      min: 400.0

  cpi_24inch_step100:
    # CPI is a model parameter, but it is sampled on the practical hardware
    # grid 400, 500, ..., 1600 instead of every possible decimal value.
    list: [theta_m, theta_c, rew_succ, rew_fail, time_penalty, effort_cost, mouse_rotation_gain_x, mouse_rotation_gain_y, mouse_plan_correction, mouse_cpi]
    theta_m:
      type: uniform
      max: 0.40
      min: 0.05
    theta_c:
      type: uniform
      max: 0.40
      min: 0.05
    rew_succ:
      type: uniform
      max: 16.0
      min: 0.0
      sample_min_prob: 0.01
    rew_fail:
      type: uniform
      max: 16.0
      min: 0.0
      sample_min_prob: 0.01
    time_penalty:
      type: uniform
      max: 32.0
      min: 0.0
      sample_min_prob: 0.01
    effort_cost:
      type: uniform
      max: 32.0
      min: 0.0
      sample_min_prob: 0.01
    mouse_rotation_gain_x:
      type: uniform
      max: 10.0
      min: -10.0
    mouse_rotation_gain_y:
      type: uniform
      max: 10.0
      min: -10.0
    mouse_plan_correction:
      type: uniform
      max: 1.0
      min: 0.0
    mouse_cpi:
      type: uniform
      max: 1600.0
      min: 400.0
      values: [400.0, 500.0, 600.0, 700.0, 800.0, 900.0, 1000.0, 1100.0, 1200.0, 1300.0, 1400.0, 1500.0, 1600.0]


