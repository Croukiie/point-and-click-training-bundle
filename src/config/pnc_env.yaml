window_ratio_width: 16
window_ratio_height: 9

constraint:
  window_width: 0.6
  target_radius: 0.024
  target_speed: 0.24
  

default:
  mouse_gain: 4.16
  mouse_mapping: rotational
  mouse_rotation_gain_x: -3.0
  mouse_rotation_gain_y: 0.0
  mouse_plan_correction: 0.0
  range:
    window_width:
      max: 0.6
      min: 0.6
    target:
      radius:
        max: 0.007
        min: 0.00125
      speed:
        max: 0.0
        min: 0.0
      id:
        min: 2.5
        max: 7.2
  option:
    speed:
      sample_min_prob: 0.0
    pos:
      min_dist_to_cursor: 0.005
    id:
      uniform: True


static_target:
  mouse_gain: 1
  mouse_mapping: rotational
  mouse_rotation_gain_x: -3.0
  mouse_rotation_gain_y: 0.0
  mouse_plan_correction: 0.0
  range:
    window_width:
      max: 0.6
      min: 0.3
    target:
      radius:
        max: 0.07
        min: 0.001
      speed:
        max: 0.0
        min: 0.0
      id:
        min: 2
        max: 6.5
  option:
    speed:
      sample_min_prob: 0.0
    pos:
      min_dist_to_cursor: 0.03
    id:
      uniform: True

static_target_window:
  mouse_gain: 4.16
  mouse_mapping: rotational
  mouse_rotation_gain_x: -3.0
  mouse_rotation_gain_y: 0.0
  mouse_plan_correction: 0.0
  range:
    window_width:
      max: 0.6
      min: 0.6
    target:
      radius:
        max: 0.007
        min: 0.00125
      speed:
        max: 0.0
        min: 0.0
      id:
        min: 2.5
        max: 7
  option:
    speed:
      sample_min_prob: 0.0
    pos:
      min_dist_to_cursor: 0.005
    id:
      uniform: True
