window_ratio_width: 16
window_ratio_height: 9
monitor_diagonal_inches: 24

constraint:
  window_width: 0.5313124474
  target_radius: 0.024
  target_speed: 0.24
  

default: &default
  # 24-inch 16:9 Full HD: one raw count equals one 1920px screen pixel at 400 CPI.
  mouse_gain: 4.357877685367455
  mouse_reference_cpi: 400
  cpi: 400
  mouse_mapping: rotational
  mouse_rotation_gain_x: -3.0
  mouse_rotation_gain_y: 0.0
  mouse_plan_correction: 0.0
  initial_mouse_orientation:
    type: uniform
    min_deg: -15.0
    max_deg: 15.0
  range:
    window_width:
      max: 0.5313124474
      min: 0.5313124474
    target:
      radius:
        max: 0.007
        min: 0.00125
      speed:
        max: 0.0
        min: 0.0
      id:
        min: 2.5
        max: 7.2
  option:
    speed:
      sample_min_prob: 0.0
    pos:
      min_dist_to_cursor: 0.005
    id:
      uniform: True

default_ori0:
  <<: *default
  initial_mouse_orientation:
    type: fixed
    value_deg: 0.0

default_ori_asym:
  <<: *default
  initial_mouse_orientation:
    type: uniform
    min_deg: -10.0
    max_deg: 20.0

# Frozen profile for the radius-matched CPI transfer experiment. Keep this
# separate from ``default`` so later edits cannot silently change its task.
radius_matched_cpi:
  <<: *default
  range:
    window_width:
      max: 0.5313124474
      min: 0.5313124474
    target:
      radius:
        max: 0.007
        min: 0.00125
      speed:
        max: 0.0
        min: 0.0
      id:
        min: 2.5
        max: 7.2
  option:
    speed:
      sample_min_prob: 0.0
    pos:
      min_dist_to_cursor: 0.005
    id:
      uniform: True


static_target:
  mouse_gain: 1
  mouse_reference_cpi: 400
  cpi: 400
  mouse_mapping: rotational
  mouse_rotation_gain_x: -3.0
  mouse_rotation_gain_y: 0.0
  mouse_plan_correction: 0.0
  initial_mouse_orientation:
    type: uniform
    min_deg: -15.0
    max_deg: 15.0
  range:
    window_width:
      max: 0.5313124474
      min: 0.5313124474
    target:
      radius:
        max: 0.07
        min: 0.001
      speed:
        max: 0.0
        min: 0.0
      id:
        min: 2
        max: 6.5
  option:
    speed:
      sample_min_prob: 0.0
    pos:
      min_dist_to_cursor: 0.03
    id:
      uniform: True

static_target_window:
  # Same 24-inch Full HD calibration as the default task.
  mouse_gain: 4.357877685367455
  mouse_reference_cpi: 400
  cpi: 400
  mouse_mapping: rotational
  mouse_rotation_gain_x: -3.0
  mouse_rotation_gain_y: 0.0
  mouse_plan_correction: 0.0
  initial_mouse_orientation:
    type: uniform
    min_deg: -15.0
    max_deg: 15.0
  range:
    window_width:
      max: 0.5313124474
      min: 0.5313124474
    target:
      radius:
        max: 0.007
        min: 0.00125
      speed:
        max: 0.0
        min: 0.0
      id:
        min: 2.5
        max: 7
  option:
    speed:
      sample_min_prob: 0.0
    pos:
      min_dist_to_cursor: 0.005
    id:
      uniform: True
